  { q: "Which of the following passages is NOT listed as a biblical reference supporting Jesus as the only way to the Father?", options: ["Ephesians 2:18", "Hebrews 7:25", "1 Timothy 2:5", "Luke 15:3-7"], answer: 3 },
  { q: "According to the lesson in week 3, which of the following correctly identifies the five reasons Jesus is our Great Shepherd?", options: ["He fulfilled prophecy, redeemed us, provides for us, assures us of eternal life, and establishes our identity as sons.", "He fulfilled prophecy, delivered us from physical suffering, provides wealth, assures us of earthly success, and establishes our identity as prophets.", "He fulfilled prophecy, forgives our sins, provides for us, guarantees freedom from trials, and establishes our identity through good works.", "He fulfilled prophecy, redeemed us, provides for us, assures us of eternal life, and establishes our identity through human effort."], answer: 0 },
  { q: "Which combination of scriptures was cited in the lesson to establish that Jesus fulfilled prophecy concerning the Great Shepherd?", options: ["Psalm 23:1–6, John 10:28–30, Titus 1:2, and Romans 5:21.", "Ezekiel 34:23–24, Isaiah 40:11, Micah 5:4–5, and John 10:11, 15.", "John 1:12–13, Romans 8:14, 1 John 3:1, and Revelation 5:9.", "1 Peter 2:25, Revelation 5:9, John 10:9, and Psalm 23:4–6."], answer: 1 },
  { q: "According to the lesson, which statement best explains the connection between Jesus’ sacrifice and the believer’s assurance of eternal life?", options: ["Jesus’ death fulfilled prophecy, but eternal life depends primarily on a believer’s ability to maintain good works.", "Jesus’ death restored our souls, but eternal life is only a promise for believers after they have completed their earthly assignments.", "Jesus laid down His life for the sheep, redeemed us through His blood, and gives His sheep eternal life, assuring them that no one can snatch them from His or His Father’s hand.", "Jesus laid down His life for the sheep so that believers would no longer experience hardship, temptation, or suffering."], answer: 2 },
  { q: "The lesson connected our identity as sons to four specific scripture passages. Which option correctly matches those passages with the teaching?", options: ["John 10:3–5 eternal life; John 1:12–13 provision; Romans 8:14 redemption; 1 John 3:1 prophecy.", "John 10:3–5 recognising the Shepherd’s voice; John 1:12–13 the right to become God’s children; Romans 8:14 being led by God’s Spirit; 1 John 3:1 the love through which God calls us His children.", "John 10:3–5 redemption through blood; John 1:12–13 eternal security; Romans 8:14 fulfilment of prophecy; 1 John 3:1 provision for our needs.", "John 10:3–5 being led by the Spirit; John 1:12–13 recognising the Shepherd’s voice; Romans 8:14 becoming God’s children through natural birth; 1 John 3:1 the promise of eternal life."], answer: 1 },
  { q: "Which of the following pairs of scriptures speaks about the Shepherd’s personal knowledge of His sheep and God’s knowledge of those who belong to Him?", options: ["John 10:27–28 and Psalm 91:1–4", "Psalm 23:1–3 and Isaiah 48:17", "John 10:14 and 2 Timothy 2:19", "Philippians 4:19 and Matthew 6:33"], answer: 2 },
  { q: "The lesson contrasted Jesus with a hireling. Which statement best captures the difference between them as taught in class?", options: ["The hireling leads the sheep during peaceful times, while Jesus only intervenes when they are in danger.", "The hireling abandons the sheep when danger comes, but Jesus demonstrates His care by remaining committed to them, even to the point of laying down His life.", "The hireling provides physical needs, while Jesus is concerned only with the spiritual needs of His sheep.", "The hireling knows the sheep individually, while Jesus depends on others to identify those who belong to Him."], answer: 1 },
  { q: "A believer is trusting God for provision but is tempted to pursue material needs at the expense of seeking His kingdom. Based on the lesson, which pair of scriptures directly supports the teaching on God’s provision for His sheep?", options: ["Philippians 4:19 and Matthew 6:33.", "Psalm 139:1–3 and 2 Timothy 2:19.", "Isaiah 48:17 and John 16:13.", "Psalm 91:1–4 and Zechariah 2:5."], answer: 0 },
  { q: "Which option correctly matches each responsibility of the Great Shepherd with the scripture references given in the lesson?", options: ["Knowing His sheep Psalm 23:1–3; leading His sheep Psalm 139:1–3; protecting them Philippians 4:19; providing for them John 10:27–28.", "Knowing His sheep John 10:15; leading His sheep Zechariah 2:5; protecting them Isaiah 48:17; providing for them Hebrews 13:20–21.", "Knowing His sheep John 16:13; leading His sheep 2 Timothy 2:19; protecting them Matthew 6:33; providing for them Psalm 91:1–4.", "Knowing His sheep John 10:14; leading His sheep Isaiah 48:17; protecting them Psalm 91:1–4; providing for them Philippians 4:19."], answer: 3 },
  { q: "David argues that since God is the owner of every gift, a Christian who preserves the gifts entrusted to him without using them has fulfilled his responsibility but Paul insists that the parable of the talents distinguishes between preserving what is entrusted and being faithful with it. Which assessment best reflects the teaching of the parable?", options: ["David is correct, because stewardship requires preserving God's gifts, while their use determines the degree of reward received.", "Paul is correct, because stewardship requires using God's gifts faithfully, although the reward depends primarily on the quantity of results produced.", "David is partly correct, because avoiding the misuse of God's gifts fulfils the primary demand of stewardship, even when opportunities for service are neglected", "Paul is correct, because faithful use of God's entrusted gifts brings reward, whereas negligence leads to loss."], answer: 2 },
  { q: "A wealthy Christian maintains that his financial success demonstrates that he has managed his life well. He gives occasional offerings but directs most of his attention towards accumulating more wealth and securing his future comfort. When challenged, he argues that the problem with the rich fool was not his wealth but simply his failure to plan adequately for the future. As a Sunday school student, which option do you think most accurately reflects the lesson of the parable?", options: ["His interpretation is incomplete, because the rich fool's error was planning for earthly security without adequately considering his accountability to God.", "His interpretation is correct, because the rich fool's error was failing to prepare for future needs, rather than the purpose for which he accumulated wealth.", "His interpretation is incomplete, because wealth is acceptable only when it is distributed entirely towards God's purposes rather than used for personal needs.", "His interpretation is correct in principle, because financial planning demonstrates wisdom, although the rich fool should have allocated a larger portion of his wealth to religious activities."], answer: 0 },
  { q: "Tolu is a worker in DGC and she consistently participates in evangelism and other religious activities. One day, she encounters a person from a different ethnic and religious background who urgently needs assistance. She chooses not to help, arguing that his primary responsibility is to serve God through church activities and that assisting strangers is a separate matter. Which response best captures the relationship between religious devotion and service in the parable of the Good Samaritan?", options: ["Her position is incomplete, because practical service is important, but its priority depends on whether the person in need belongs to the Christian community.", "Her position is incomplete, because service to God includes practical expressions of love, although religious participation remains the more direct demonstration of that service.", "Her position is mistaken, because the parable requires believers to prioritise strangers over religious responsibilities whenever the two compete.", "Her position is mistaken, because true service expresses love through action beyond religious and racial boundaries, rather than being limited to participation in religious activities."], answer: 3 },
  { q: "During a Bible study, two believers express different views. The first argues that God's patience means a believer can postpone fruitfulness until judgment approaches. The second maintains that spiritual preparedness is necessary only when there are clear indications that Christ's return is near. Their teacher observes that both positions may confuse God's patience with the believer's responsibility. As a Sunday school student, which option best distinguishes the lessons of the two parables of the barren fig tree and the ten virgins?", options: ["The barren fig tree teaches that fruitfulness is expected before judgment, while the ten virgins teach that readiness becomes necessary when the Bridegroom's arrival is imminent.", "The barren fig tree emphasises God's expectation of fruitfulness before judgment, while the ten virgins emphasise the need for spiritual vigilance in readiness for the Bridegroom's coming.", "The barren fig tree emphasises fruitfulness as evidence of preparedness for Christ's return, while the ten virgins emphasise spiritual vigilance as the means of producing that fruitfulness.", "The barren fig tree emphasises God's patience towards unfruitful believers, while the ten virgins emphasise the importance of maintaining religious activities while awaiting Christ's return."], answer: 1 },
  { q: "During a follow-up visit, Miss Eyinjuoluwa who is a worker discovers that Sister Jesufemi the new convert has repeatedly failed to keep commitments made during discipleship. Miss Eyinju then concludes that showing love before the convert changes would encourage irresponsibility. Based on the teaching during Sunday school, which response best reflects the way Jesus revealed the Father's love?", options: ["Miss Eyinju should demonstrate love while Sister Jesufemi is changing, because the Father's love is expressed most fully when people respond positively to His instructions.", "Miss Eyinju should demonstrate love without making behavioural improvement a condition for it, while still helping Sister Jesufemi grow in discipleship.", "Miss Eyinju should demonstrate love after correcting Sister Jesufemi, because the Father's love is revealed through correction before compassion.", "Miss Eyinju should demonstrate love by accepting Sister Jesufemi's present condition without correction, because the Father's love must not be mixed with expectations of change."], answer: 1 },
  { q: "Mr Fola is exhausted from serving and begins to feel that God must be disappointed in him because his performance has declined. He decides to work harder until he feels worthy of His love again. Following the teaching on Jesus' consciousness of the Father's love, which assessment is the most accurate?", options: ["His response is incomplete because God's love motivates service, but consistent service is what maintains the believer's experience of that love.", "His response is incomplete because Jesus was conscious of the Father's love, but that consciousness was primarily the reward for fulfilling His assignment.", "His response is incomplete because the Father's love should motivate service, but the believer must first restore spiritual discipline before relying on that love.", "His response is incomplete because the Father's love motivated Jesus, so he should serve from the consciousness of God's love rather than treat service as a means of earning it."], answer: 3 },
  { q: "During let's-go-a-fishing, a team encounters a family that urgently needs food. Toju insists that preaching the gospel is the team's only spiritual responsibility and that meeting physical needs is separate from revealing God's love. Which response best aligns with what was taught in Sunday school?", options: ["Jesus' miracles expressed His love and compassion, so meeting practical needs can also express love, even though not every act of love must be miraculous.", "Jesus' miracles expressed His love and compassion, so practical assistance demonstrates God's love only when accompanied by a supernatural manifestation.", "Jesus' miracles expressed His love and compassion, but meeting physical needs should remain secondary because teaching about God's love is the primary demonstration.", "Jesus' miracles expressed His love and compassion, so practical assistance is appropriate mainly when it creates an opportunity to preach the gospel to the recipients."], answer: 0 },
  { q: "Mr Deji is a unit leader known for excellent service and strict adherence to instructions. However, he frequently speaks harshly to team members and dismisses their struggles as distractions from ministry. He argues that his commitment to God's work proves that he is walking in love. What option do you think best reflects the conclusion of the teaching?", options: ["His commitment is evidence of love for God, while his treatment of people is a separate area of character development that does not directly concern Kingdom service.", "His commitment is evidence of love for God, and his treatment of people becomes a concern only when it begins to affect the unit's productivity.", "His understanding is incomplete because consciousness of God's love should shape both his service to God and his compassion toward people, making love a central motivation for Kingdom service.", "His understanding is incomplete because compassion toward people should motivate his service, while consciousness of God's love is primarily intended to strengthen his personal devotion."], answer: 2 },
  { q: "Evelyn is a new member of DGC. She struggles to understand why members frequently greet one another and say, “I love you.” She explains that she grew up believing that one must always be a good girl and remain in God's good graces to experience His love and enjoy His gifts. Based on the teaching, “Jesus, Our Perfect Example of Love,” which response best explains God's unconditional love to her?", options: ["God loves us when we consistently obey Him and prove that we are worthy of His blessings.", "God's love is demonstrated through Christ's death for us while we were still sinners; therefore, His love is rooted in who He is, not in our worthiness.", "God's love is available to everyone, but we must first demonstrate sufficient goodness before we can experience it.", "God loves us unconditionally, so our actions and responses to Him do not matter."], answer: 1 },
  { q: "Based on the teaching, “Jesus, Our Perfect Example of Love,” which of the following correctly identifies the three characteristics of Jesus’ love that were discussed?", options: ["Unconditional, emotional and compassionate.", "Forgiving, patient and sacrificial.", "Unconditional, demonstrated through action, and sacrificial", "Demonstrated through action, compassionate and dependent on people's response."], answer: 2 },
  { q: "Bro Jason, the head of the Speaking Unit, believes strongly in discipline and authority. However, his members complain that his words often tear them down. Jason argues that John 15:13 teaches that the greatest expression of love is laying down one's life for another, so he does not see the need to change how he speaks to people unless he is required to die for them. Based on the teaching, what is the major flaw in Jason’s understanding of love?", options: ["He is correct because laying down one's life is the only expression of love that truly matters, while words and daily conduct are secondary.", "He focuses on sacrificial love while neglecting that Jesus also demonstrated love through practical actions and that love must be expressed unconditionally, including in how he treats people.", "He misunderstands sacrificial love because he believes it applies only to family members and close friends, not people under his leadership.", "He fails to understand that love means avoiding correction and allowing members to act however they wish, regardless of the consequences."], answer: 1 },
  { q: "David leads a unit in church and insists that members must always serve him first because of his position. He believes that being a leader means receiving service rather than performing tasks that may appear beneath his status. Considering Jesus’ actions in John 13:3–5 and His words in Matthew 20:28, which statement best captures the understanding David is missing?", options: ["Leadership requires humility in receiving correction from others, but a leader may still reserve certain acts of service for those under his authority.", "Leadership follows Christ’s example when a person uses his position to serve others, demonstrating humility without considering service beneath his status.", "Leadership follows Christ’s example when a person serves others willingly, provided that his position and authority are still recognised by those he serves.", "Leadership requires a willingness to serve others when necessary, but the primary responsibility of a leader is to ensure that others meet his needs so he can lead effectively."], answer: 1 },
  { q: "Which of the following statements correctly identifies the four reasons discussed in the teaching for why love must find expression in service?", options: ["Love serves rather than seeking to be served; service demonstrates spiritual maturity; service meets physical needs; service establishes order in the church.", "Love is expressed through obedience; service demonstrates commitment to God; service restores broken relationships; service prepares believers for leadership", "Love requires personal sacrifice; service demonstrates humility; service builds individual faith; service promotes accountability among believers.", "Love serves rather than seeking to be served; service is proof of Christlikeness; service heals the hurting; service strengthens the body of Christ."], answer: 3 },
  { q: "Two Units in a church have been experiencing tension because each group believes its own assignments are more important. During a church programme, members of one group refuse to help the other group with its responsibilities. The situation begins to affect the unity of the church. According to the teaching on Love in Service, which response best addresses the problem?", options: ["Each group should focus exclusively on its own responsibilities to avoid interfering with another group’s work.", "The leaders should assign additional duties to the less busy group so that the workload is distributed fairly.", "Members should demonstrate love by serving one another across group boundaries, allowing practical expressions of care to strengthen unity in the body of Christ.", "The groups should suspend their activities until the leaders resolve the disagreement and clarify their respective responsibilities."], answer: 2 },
  { q: "Brother James tithes faithfully, leads the choir, and never misses service. But she has refused to speak to a sister in the church for months over an offence. She says, \"My relationship with God is fine; this is just between me and her.\" In light of the teaching, how can we interpret/address the scenario?", options: ["Her love for God is genuine, but it remains incomplete until she reconciles, so she should seek peace with the sister soon.", "Her relationship with God is intact, but her unresolved offence is damaging her testimony before others in the church.", "She should wait for the sister to apologise first, since the sister caused the offence.", "Her claim to love God is itself in question, because Scripture does not separate loving God from loving the brother."], answer: 3 },
  { q: "Brother Dunsin says, \"I don't steal, lie or cheat anyone, so I'm fulfilling the law. I just don't go out of my way for people.\" He points to Romans 13:10: \"Love worketh no ill to his neighbour: therefore love is the fulfilling of the law.\" Which response shows the best understanding?", options: ["He is not absolutely wrong but it’s. It is good enough he is not working in sin as the verse defines love as doing no ill.", "Avoiding harm is only part of it. Romans 13:8 says, \"Owe no man anything, but to love one another,\" so love is an active debt we keep paying, not just a list of things we avoid.", "He has kept the letter of the law. Going out of his way for people is the higher calling of grace, beyond what the law itself requires.", "He is wrong, because keeping commandments without warm feelings towards people is empty religion."], answer: 1 },
  { q: "Two church members are arguing sharply over doctrine in a WhatsApp group that includes unbelieving colleagues. One of them says, \"What matters is that our doctrine is correct. Outsiders will respect us for standing for the truth.\" Considering the teaching, what is the best response to this scenario?", options: ["Sound doctrine is the foundation of the faith, so their zeal is right. They only need to keep their tone respectful.", "They should do it in their private chat to avoid any affecting other believers.", "Truth matters, but Jesus said the world would recognise His disciples by their love for one another, so how they treat each other is itself their witness.", "Believers shouldn't let outsiders' opinions shape how they handle disagreements. Only God's approval matters."], answer: 2 },
  { q: "Two church departments get along politely, with no quarrels. But each one guards its own budget and they never help each other. The pastor says something is still missing. Based on Colossians 3:14, \"And above all these things put on charity, which is the bond of perfectness,\" what is missing?", options: ["Love that goes beyond tolerating each other and binds them together in selfless service, so the church shows the reality of God's kingdom.", "Nothing important. Peace and cooperation are already the fruit of love, and polite coexistence is unity.", "Clear and fair policies for sharing budgets and volunteers, since order and fairness keep the peace in God's house.", "A wise leader full of the Spirit to head both departments so decisions made don’t hurt another leader."], answer: 0 },
  { q: "Brother Tayo, a senior engineer, joins the church media team. He wants his professional title acknowledged and refuses tasks like carrying cables or setting up chairs. He says, \"God gave me these skills. Pretending to be less than I am is false humility. What is the best response according to the teaching?", options: ["He has a point. Gifts should not be buried, so the team should give him tasks that make full use of his God given gifts.", "Christ did not stop being God, yet He laid aside His reputation to take the form of a servant. Having that mind means being willing to set aside status in order to serve.", "Humility is an attitude of the heart. If he is humble inside, and the Spirit doesn’t convict him, it doesn't really matter which tasks he agrees to do.", "He should be asked to leave the team until he learns to be humble so he doesn’t affect the faith of others."], answer: 1 },
  { q: "Brother Nicholas, 22, is a gifted preacher who feels called to ministry. He has stopped helping in his parents' shop and at home, saying, \"Jesus Himself said, 'Wist ye not that I must be about my Father's business?' My heavenly Father's work comes first.\" Since Jesus is our perfect example, what’s the best verdict on this scenario?", options: ["He is right. Jesus' own words at His parents show that a divine calling must take priority over earthly duties.", "He should balance the two with wisdom, giving ministry his best energy and helping his parents whenever time allows.", "He should leave home immediately as Eliasa did so that nothing distracts him from his calling.", "Being called does not cancel humble services at home, and that hidden service is part of the preparation."], answer: 3 },
  { q: "Sister Marvelous has just been appointed head of the ushering unit. She tells her team, \"My job now is to supervise and delegate. If members see me arranging chairs, they won't respect my authority.\" According to the teaching, how valid is this statement by this leader?", options: ["Jesus washed feet because He was Lord and Master, not in spite of it. A leader's authority is shown through serving, setting the example the team should follow.", "Delegation is biblical, since Jethro advised Moses to share the load. She is right to focus on supervising, as long as she leads kindly.", "She can serve on special occasions to show humility, but keep her supervisory distance the rest of the time.", "She should step down, since she is clearly not ready for leadership."], answer: 0 },
  { q: "Sister Pelumi has cooks for and visits elderly church members. Some are ungrateful and even disrespect/bad mouth her in their homes and in church. She decides, \"I'll keep serving people, but only those who appreciate it. Serving someone who doesn't deserve it just encourages the bad behaviour.\" What is the best advice for her according to the teaching?", options: ["Wisdom calls for boundaries. As Jesus withdrew from the crowds at times, so she is right to redirect her service to those who receive it.", "She should keep serving all, keeping in mind that reconciliation will come as she keep serving.", "The height of Christ’s service was given to people who had not earned it, and that is the pattern we follow.", "She should report bad behaviour to the pastorate and let them church handle it."], answer: 2 },
  { q: "A ministry coordinator who has demonstrated exceptional competence is asked to assist with a task usually assigned to new volunteers. The coordinator declines, explaining that accepting the task could blur organisational responsibilities and prevent junior members from developing. However, when the same coordinator is asked to perform a similarly ordinary task during a high-profile programme, they accept because the decision will be visible to senior leadership. Considering John 13:3–5 and Philippians 2:5–8, which interpretation most precisely identifies the underlying issue?", options: ["The coordinator has correctly identified the importance of delegation but has failed to recognise that leadership responsibilities must sometimes be suspended to demonstrate humility.", "The coordinator's inconsistent response suggests that their willingness to perform low-status tasks may depend more on their perceived image than on a stable posture of humility grounded in identity.", "The coordinator has misunderstood delegation because a true servant must personally perform every task they are capable of completing, irrespective of organisational needs.", "The coordinator's conduct demonstrates that practical service is spiritually meaningful only when it involves surrendering an existing position of authority."], answer: 1 },
  { q: "A volunteer discovers that another team member has repeatedly taken credit for their contributions. The volunteer decides to continue working with the person but stops correcting errors that could affect the team's performance, believing that a true servant should surrender personal interests rather than defend them. Considering John 13:34–35 and 1 Corinthians 13:1–3, which response best integrates love and genuine service?", options: ["The volunteer should remain silent because protecting the relationship is more consistent with selflessness than confronting conduct that may create conflict.", "The volunteer should withdraw from all collaborative work with the person because continuing to assist them would reward conduct inconsistent with Christian love.", "The volunteer should expose the colleague's conduct publicly because defending the truth is more important than preserving the appearance of unity.", "The volunteer should address the misconduct constructively and protect the team's work while ensuring that the response is motivated by love and responsibility rather than retaliation or a desire for personal vindication."], answer: 3 },
  { q: "A student accepts every available ministry assignment, repeatedly sacrifices study time, and becomes unable to complete responsibilities effectively. They argue that their willingness to give up personal comfort proves their devotion. Which response best reflects the true heart of service?", options: ["The student should retain the assignments but improve time management, since disciplined organisation enables greater sacrifice without necessarily reducing commitment.", "The student should reduce their assignments because sacrificial service is meaningful only when it does not interfere with existing personal responsibilities.", "The student should seek assistance with some responsibilities, since distributing work can preserve their willingness to sacrifice while improving the effectiveness of service.", "The student should examine whether their whole-life commitment is being directed towards God's purpose or whether the quantity of personal discomfort has become their measure of devotion."], answer: 2 },
  { q: "Pastor Kalu repeatedly gives money to a struggling member, knowing it feeds a gambling habit, because refusing would make him feel unkind. Which is most accurate?", options: ["This is love in action, since costly giving is the proof of love.", "This resembles love but serves his own comfort, since seeking another’s good above self can cost him the feeling of being kind.", "This is a failure of humility, since he assumes he knows better than the member.", "This is a failure of faithfulness, since he lacks consistency in setting boundaries."], answer: 1 },
  { q: "Shola believes that a proposed programme conflicts with God's direction. However, he proceeds because he fears that disagreeing with leadership could diminish his influence and prevent him from contributing to future projects. He later argues that his decision was strategic rather than disobedient. Considering 1 Samuel 13:8–12 and the manual's emphasis on pleasing God rather than people, which analysis is strongest?", options: ["His decision demonstrates practical wisdom because preserving influence can be a legitimate means of accomplishing a greater spiritual purpose.", "He should have opposed the programme immediately, because pleasing God requires public resistance whenever a leader's decision appears inconsistent with personal conviction.", "He must examine whether preserving influence has displaced obedience as the controlling motive, while seeking clarity rather than treating strategic usefulness as sufficient justification.", "His decision is defensible if the programme's outcome benefits the ministry, because spiritual intentions should be evaluated partly by their consequences."], answer: 2 },
  { q: "Mr. Ade teaches, \"Greatness is found in serving.\" Tayo starts serving harder to become great. Which statement is most accurate?", options: ["Tayo is right, since the teaching links service to greatness as a means.", "Tayo is wrong because a believer should never think about greatness.", "Tayo is wrong only if he seeks recognition, and fine if the platform lets him bless others.", "Tayo has inverted the teaching: greatness is found within serving, not a rank gained through it, so using service as a ladder replaces what it names."], answer: 3 },
  { q: "A young professional is offered an opportunity to lead a church project that requires substantial time. Accepting it would strengthen their professional portfolio but also require sacrifices in personal comfort. The professional accepts immediately and describes the decision as evidence of sacrificial service. Using John 15:12–13 and Romans 12:1–2, which question most directly tests the spiritual quality of the decision?", options: ["Whether the professional can complete the project successfully without requiring additional assistance from other volunteers.", "Whether the professional is willing to sacrifice more time than other candidates who could undertake the same assignment.", "Whether the professional's career would benefit more from the project than from alternative opportunities that require less personal sacrifice.", "Whether the decision is genuinely directed towards God's purpose and the good of others, or whether the language of sacrifice is concealing a desire for recognition and personal advancement."], answer: 3 },
  { q: "A ministry media coordinator posts all her service acts, truthfully and with good intent. Which indicator most reliably shows whether she is identity-conscious or image-conscious?", options: ["Whether the timing, framing, and selection of the act are shaped by how it will appear.", "Whether her posts are truthful and well-intentioned.", "Whether she posts less than others do.", "Whether she feels uncomfortable when posting."], answer: 0 },
  { q: "In Luke 5:31–32 Jesus utilizes the metaphor of a physician to explain the core purpose of His mission. How does this analogy distinguish His redemptive work from mere moralism or conventional medical practice?", options: ["It establishes that He did not come to validate the self-righteous, but to diagnose and cure the root disease of sin, treating spiritual bankruptcy through repentance rather than superficial moral reform.", "It shows that His healing authority was strictly confined to physical diseases, deliberately excluding emotional and spiritual needs.", "It reveals that His primary mission was to abolish human medical professions and replace earthly doctors with immediate miraculous interventions.", "It indicates that He viewed bodily preservation and physical comfort as superior to the spiritual transformation of the soul."], answer: 0 },
  { q: "Why is the diagnostic and healing ability of Jesus uniquely complete compared to that of any human practitioner?", options: ["Because He focuses exclusively on alleviating emotional trauma while allowing the physical body to heal purely by chance.", "His diagnostic expertise relies on the progressive medical knowledge and clinical tools developed across human history.", "Because as the Creator of the body, He understands not merely what hurts, but the underlying reason why it hurts, addressing both physical distress and the spiritual condition behind it.", "Because He only provides healing when the afflicted person possesses a full, clinical understanding of their own disease."], answer: 2 },
  { q: "Unlike earthly doctors whose efficacy is restricted by resources, time, andhuman knowledge, how does the Great Physician’s power operates without boundaries (Mark 5:41, Matthew 8:5–13)?", options: ["By showing that He requires extensive ceremonial preparations and medicinal herbs before any cure can take effect.", "By demonstrating that He transcends all natural limitations, commanding healing authoritatively through a single word, a physical touch, or across distance without spatial barrier.", "By mandating that all sufferers make a physical pilgrimage to the temple in Jerusalem to secure their healing.", "By showing that His miraculous acts were conditional upon the medical technologies available in first-century Judea."], answer: 1 },
  { q: "In contrasting temporary relief with divine restoration (referencing Mark 2:5–12 and Isaiah 53:4–5), what fundamentally defines the \"permanent wholeness\" that Jesus imparts?", options: ["He grants a physical body that is entirely immune to biological aging and physical mortality in this present life.", "He provides immediate, superficial comfort by suppressing visible symptoms while leaving the origin of the grief untouched.", "He deliberately separates physical recovery from inner spiritual renewal, treating each as independent and unrelated states.", "He penetrates beyond outward, secondary symptoms to eradicate the root cause, bringing comprehensive restoration to the body, heart, and soul."], answer: 3 },
  { q: "How does Christ’s invitation, “Come unto Me,” define the scope of His healing ministry for the inner life?", options: ["It demonstrates that His work on the cross secured a covenant of inner restoration, extending divine rest and compassionate care directly to those crushed by emotional exhaustion, anxiety, and brokenness of heart.", "It restricts divine restoration solely to individuals who have already attained moral perfection and emotional stability through personal discipline.", "It reveals that Christ regards inner mental turmoil as an illusion, commanding believers to seek relief exclusively through natural stoic detachment.", "It limits Christ's restorative authority to physical diseases, leaving emotional trauma to be resolved entirely apart from His grace."], answer: 0 },
  { q: "How can you distinguish the “Gift of His Peace” from worldly or purely human concepts of peace?", options: ["It operates as a form of temporary psychological escapism that merely ignores difficult external realities rather than confronting them.", "It provides an outward guarantee that believers will never face persecution, relational friction, or difficult life circumstances.", "It is a supernatural gift that transcends the comprehension of the natural mind, actively calming inward turbulence and silencing deep-seated anxious thoughts.", "It is an emotional state achieved strictly through human meditation techniques that suppress all natural feelings."], answer: 2 },
  { q: "According to 2 Corinthians 1:3–4 and Psalm 34:18, what is the ultimate redemptive purpose of the Father’s compassionate comfort when He reaches into the depths of human grief?", options: ["To foster an isolated, self-centered focus that excuses the believer from further involvement in the fellowship of the church.", "To bring deep emotional healing to the brokenhearted in such a way that it prepares and equips them to minister comfort to others in the time of affliction.", "To prove that any experience of emotional woundedness is definitive evidence of an absence of divine favor.", "To ensure that believers become entirely dependent on human praise and societal approval for their sense of security."], answer: 1 },
  { q: "In light of Psalm 19:7 and Romans 12:2, what is the specific role of the Word of God in ministering to a troubled mind and broken emotions?", options: ["As an ancient ethical code designed to demand external compliance without addressing internal psychological agony.", "As an intellectual philosophy intended to suppress human sorrow through strict ideology.", "As a purely symbolic text that offers inspirational poetry without possessing the capacity to alter human brain patterns or emotional states.", "As divine medicine to the mind and a soothing balm to the emotions, capable of renewing fractured thought patterns and supplanting despair with enduring hope."], answer: 3 },
  { q: "Based on the life of Jesus, true faith is not passive belief but is?", options: ["A theoretical doctrine preserved primarily through memory verses", "A lifestyle of hearing, trusting, and acting on God's Word", "A one-time act of acceptance requiring no ongoing daily walk", "An emotional feeling detached from divine purpose"], answer: 1 },
  { q: "A believer encounters a friend enduring deep grief. Instead of dismissing the distress or remaining passive, the believer channels their emotional care into prayer and practical support to accomplish God's purpose. Which expression of Jesus' faith is best demonstrated in this situation?", options: ["Faith tested through wilderness temptation", "Faith expressed through compassion, where faith and love work together", "Passive belief that ignores human emotion", "Faith focused primarily on achieving immediate visible results"], answer: 1 },
  { q: "What is the complete progression of Jesus' faith from foundation to triumph?", options: ["It starts in intimacy/relationship, is tested through obedience, operates in love, and triumphs through perseverance", "It starts with suffering, transitions into passive belief, and ends in theoretical knowledge", "It relies primarily on visible results rather than intimacy with the Father", "It begins as a one-time act and avoids testing"], answer: 0 },
  { q: "Facing a severe personal trial and intense pressure, Stanley yields their personal desire and prays, \"Not my will, but Yours be done,\" enduring hardship to fulfill God's plan. How is this dimension of Jesus' faith described?", options: ["Faith under pressure, perfected through suffering, surrender, and obedience", "Faith measured by avoiding external suffering", "A theoretical belief that remains untested by trials", "A short-term decision that requires no perseverance"], answer: 0 },
  { q: "David has been praying and believing God for a new job. However, he spends his days at home without writing a CV, filling out applications, or preparing for interviews, arguing that his faith is strictly an internal belief in his mind. Which principle directly addresses David's situation?", options: ["Faith is purely an intellectual conviction that requires no external demonstration.", "Faith is not just an intellectual thing in the mind; actions and works must follow believing.", "Believing for employment requires waiting silently until an offer arrives.", "Vocalizing desires is the only required action when trusting God"], answer: 1 },
  { q: "Michael faces a challenging situation. Instead of keeping quiet or speaking vaguely, he chooses to declare his trust using clear, bold, and specific words of faith. How does Michael's conduct align with the actions of faith?", options: ["Jesus demonstrated that actions of speaking follow believing, and faith speaks boldly and specifically.", "Expressing faith verbally contradicts trusting God quietly.", "Faith requires seeing physical evidence before speaking specifically.", "Spoken declarations replace the need for backing up faith with works."], answer: 0 },
  { q: "Which verse is quoted in full as the Memory Verse regarding receiving what you desire when you pray?", options: ["Mark 11:22", "Mark 11:24 (KJV)", "Matthew 21:21", "James 2:17"], answer: 1 },
  { q: "Grace feels led to start a new initiative. She hesitates because she cannot see the complete path or how every future detail will unfold. Based on the quote by Martin Luther King Jr, what action of faith should Grace take?", options: ["Wait until the entire staircase and full outcome are visible before moving.", "Take the first step, even without seeing the whole staircase.", "Keep her belief as an intellectual idea in her mind.", "Rely solely on prayer while avoiding practical action."], answer: 1 },
  { q: "David has been trusting God for a particular breakthrough for several months. Although he initially approached the situation with a heightened level of faith, but the continued delay has caused him to become discouraged. He still believes God is able to fulfil His promise, but he has noticed that his faith is gradually weakening. Which of the following would best help him strengthen his faith in this season?", options: ["Constantly reminding himself of how long he has waited so that he can prepare for any possible outcome.", "Maintaining a consistent life of prayer and deliberately giving himself to the study of God's Word, even if his circumstances remain unchanged.", "Waiting until he feels confident again before resuming his usual spiritual routines.", "Seeking encouragement from people who have experienced similar breakthroughs and relying on their testimonies to sustain his expectation."], answer: 1 },
  { q: "During a challenging season, Grace discovers that her thoughts are increasingly dominated by fear and the possibility of failure. She still attends church and participates in Christian activities, but she rarely spends time meditating on Scripture outside church meetings. Which adjustment most directly addresses an important way faith is strengthened?", options: ["Increasing her participation in church activities until the fear gradually subsides.", "Avoiding conversations about her challenge so that she does not have to confront thoughts that weaken her confidence.", "Deliberately studying and meditating on God's Word so that her thinking and belief system are continually shaped by God's Word.", "Waiting for a special spiritual experience that will restore the confidence she once had."], answer: 2 },
  { q: "Two believers are trusting God for the same kind of breakthrough. While both confess that they believe God, the first believer consistently makes time for prayer and the study of Scripture, whereas the second relies mainly on the way he felt when he first received the promise. As time passes, the second believer begins to struggle with doubt. Which conclusion best reflects the lesson on actions of faith?", options: ["The first believer's consistency guarantees that the desired result will happen sooner than the second believer's.", "The second believer's initial confidence should be sufficient, provided he continues to confess that he believes.", "Spiritual routines become necessary only when a believer has completely lost faith.", "Faith should be continually nurtured through spiritual practices such as prayer and the study of God's Word, rather than sustained by past feelings alone."], answer: 3 },
  { q: "Michael has been praying about a difficult situation, but he feels that his faith is no longer as strong as it was when he began. He considers taking a break from prayer and Bible study until his faith returns, believing that he will be more effective when he feels spiritually stronger. Based on the lesson on actions of faith, which response best addresses his reasoning?", options: ["He should continue praying and studying the Word consistently, recognising that these are among the means through which his faith is strengthened, even when his feelings fluctuate.", "He should concentrate on positive declarations until he feels confident enough to return to prayer and Bible study.", "He should temporarily withdraw from spiritual activities that remind him of his present struggle.", "He should focus exclusively on the outcome he desires, because thinking about the process may weaken his expectation."], answer: 0 },
  { q: "Emeka has been making deliberate efforts to live a righteous life. He avoids sin, helps the needy, and participates actively in church activities. However, whenever he makes a mistake, he feels that God no longer sees him as righteous until he has done enough good deeds to make up for his failure. Based on the understanding of righteousness through faith in Christ, which of the following best addresses Emeka's misconception?", options: ["He must increase his good works until they outweigh his past mistakes and restore his standing before God.", "He should understand that righteousness is received through faith in Christ and not earned through works, while continuing to live in obedience to God.", "He must maintain a perfect record of obedience before he can confidently approach God as a righteous person.", "He should focus on religious activities because consistent participation is what qualifies a believer to be righteous before God."], answer: 1 },
  { q: "During a Bible study, Tunde argues that Abraham was accounted righteous because of the good deeds he had performed over the years. Another believer disagrees and refers to Romans 4:3, which says that Abraham believed God, and it was counted unto him for righteousness. Which conclusion best reflects the principle demonstrated in this passage?", options: ["Abraham's righteousness was the reward he received after proving himself worthy through his works.", "Abraham became righteous because his good deeds were greater than his failures.", "Abraham's experience demonstrates that righteousness is credited through faith in God rather than earned as a payment for works.", "Abraham's righteousness came from his ability to obey every instruction without making mistakes."], answer: 2 },
  { q: "After hearing a message on grace, Favour concludes that since righteousness is received through faith in Jesus Christ and not earned by works, a believer's conduct no longer matters. She believes that as long as she confesses Christ, her actions have no bearing on how she should live. Which response best reflects a balanced understanding of righteousness?", options: ["Good works are unnecessary because grace removes every responsibility a believer has toward godly living.", "A believer must first attain moral perfection before the righteousness received through Christ becomes effective.", "Righteousness is maintained by performing enough good deeds to compensate for every act of disobedience.", "Righteousness is received through faith in Christ, and good works should follow as an expression of the believer's new life rather than as a means of earning righteousness."], answer: 3 },
  { q: "Chisom has recently come to understand that Jesus died for humanity's sins and that righteousness is made available through faith in Him. However, she struggles to approach God confidently because she keeps comparing her spiritual performance with that of other believers. Which understanding would most effectively help her correct this mindset?", options: ["Her acceptance before God is grounded in Christ's redemptive work, so she can receive God's righteousness through faith rather than measuring her worth by comparison with others.", "Her acceptance before God depends on maintaining a higher standard of personal holiness than other believers.", "She must demonstrate sufficient spiritual maturity before she can regard herself as righteous in God's sight.", "Her confidence should depend on how consistently she performs religious duties compared with those around her."], answer: 0 },
  { q: "During a Sunday School Class discussion, Chinedu says that believers should approach God cautiously because the old system of worship required only the high priest to enter the Most Holy Place, and ordinary people could never enjoy that kind of access. He agrees that Jesus died for sin but assumes that the sacrifice mainly changed the way sins are forgiven, not the believer’s access to the Father. Which explanation most accurately corrects Chinedu’s understanding of the sacrifice of Jesus?", options: ["Jesus made access to God available only to believers who have reached spiritual maturity, while other believers must depend on church leaders to approach the Father.", "Jesus’ sacrifice tore down the barrier between God and humanity, giving believers ongoing access to the Father rather than restricting fellowship to a special person or occasion.", "Jesus removed the need for fellowship because His sacrifice completed every spiritual responsibility a believer could have.", "Jesus’ sacrifice changed the location of worship, but the old restrictions on who may approach God remain spiritually unchanged."], answer: 1 },
  { q: "Amara wants to obey God, but she treats righteousness as a checklist she must complete through sheer willpower. Whenever she succeeds, she believes she has earned God’s approval; whenever she struggles, she assumes God has withdrawn His help. She has heard that the new covenant involves God’s law being written in the heart, but she thinks this is only a poetic way of saying that believers should memorise more rules. Which response best reflects the lesson on righteousness through Christ’s sacrifice?", options: ["The new covenant places the entire burden on the believer to obey perfectly, because grace applies only after the believer has achieved righteousness.", "The law written in the heart means external instructions are no longer relevant, so a believer can rely on personal feelings when deciding what is right.", "The new covenant works through an inward transformation and supplies grace for righteous living, so Amara should depend on God’s work within her while responding obediently.", "The law written in the heart applies only to church leaders, who are expected to model righteousness for everyone else."], answer: 2 },
  { q: "After hearing a message about serving God, Tobi concludes that the most important believers are those with visible ministry titles. He says that the language of being priests, kings, and ambassadors must refer mainly to pastors and a few specially chosen people, because ordinary members do not have the same standing before God. Which conclusion is most consistent with the teaching in this manual?", options: ["Every believer in Christ shares in the privilege of sonship and representation; this standing is not limited to a particular tribe, lineage, or ministry title.", "Only believers who work full-time in church can be called God’s representatives, while others are simply beneficiaries of their ministry.", "Believers become co-heirs with Christ only after they demonstrate enough good works to qualify for leadership.", "The terms priests and kings describe future rewards only and have no bearing on believers’ present relationship with God."], answer: 0 },
  { q: "Kunle makes a serious mistake and feels ashamed to pray. A friend tells him that because Jesus’ sacrifice was offered once and for all, he should not treat every failure as though Christ must be sacrificed again. Kunle agrees that Jesus died once, but he is unsure whether he can seek God’s help after failing or whether doing so would make grace an excuse for carelessness. What is the most balanced application of the manual’s teaching?", options: ["Kunle should avoid prayer until he has proved through good behaviour that he deserves to return to God.", "Because Christ’s sacrifice was once for all, a believer’s choices after conversion no longer matter and repentance is unnecessary.", "Kunle should ask a church leader to obtain forgiveness on his behalf, since only ordained ministers can approach God after a serious failure.", "Kunle can come to God for help because Christ is his advocate, while taking the failure seriously and relying on grace to return to a righteous path."], answer: 3 },
  { q: "During a workplace disagreement, Ifeanyi speaks harshly to a colleague and later says, “My standing with God comes from Christ, not my behaviour, so how I speak at work does not really concern righteousness.” He knows the teaching that good works do not purchase right standing with God, but he uses that truth to dismiss the way his conduct affects others. Which response best captures the distinction taught in the lesson?", options: ["Ifeanyi is correct because once a person is righteous in Christ, everyday speech and conduct no longer have spiritual significance.", "Righteousness is received through Christ rather than earned by actions, but a new righteous creature is responsible for expressing Christ’s life in thoughts, words, and deeds.", "Ifeanyi must first repair his reputation through good works before he can be counted righteous by God again.", "Only actions performed during church services matter, because the lesson’s call to live as Christ does not extend to ordinary relationships."], answer: 1 },
  { q: "Morenike begins a new assignment that conflicts with her desire to please God. She decides to make the choice that seems easiest, then asks God to bless it afterward. When a classmate suggests praying, examining Scripture, and remaining sensitive to the Holy Spirit’s leading before deciding, she replies that faith means believing God will support whatever decision she has already made. Which approach best applies the responsibilities of a new righteous creature?", options: ["Make the decision independently, because the law of the Spirit applies only to major church decisions and not personal responsibilities.", "Choose the easiest path and rely on good intentions, since faith means expecting God to approve a believer’s preferred outcome.", "Seek God’s will, remain sensitive to the Holy Spirit’s leading, and walk by faith through obedience rather than asking God merely to endorse a decision already made.", "Avoid making any decision until another believer receives a specific revelation, because personal responsibility is inconsistent with being led by the Spirit."], answer: 2 },
  { q: "David is confident that he believes in Christ, but he treats faith as something needed only at conversion. When faced with pressure to compromise at work, he says that he has already received righteousness, so there is no need to keep exercising faith in daily decisions. He plans to choose whatever protects his position and leave spiritual matters for Sundays. Which correction is most consistent with the lesson?", options: ["Faith is necessary only before salvation; after conversion, a believer’s decisions are judged exclusively by outward success.", "Daily faith is required only when a believer has a public ministry, not when dealing with work, family, or private choices.", "David should focus on earning a stronger standing with God through visible achievements before attempting to make faith-based decisions.", "Receiving righteousness through faith does not end the believer’s responsibility to keep walking by faith; faith should shape everyday choices and help the believer please God."], answer: 3 },
  { q: "A student fellowship plans a community project. Sade argues that the group should focus only on activities inside the church because social values outside the church are not part of spiritual responsibility. Another student says believers are meant to represent God’s Kingdom wherever they are, but Sade believes this is only the responsibility of pastors and evangelists. Which response best reflects the manual’s teaching about establishing God’s Kingdom on earth?", options: ["Believers collectively have a responsibility to represent the Kingdom and spread its values in the world, so their service can extend beyond church programmes into everyday community life.", "Kingdom responsibility belongs only to ordained ministers, while other believers fulfil their calling by attending services faithfully.", "Community involvement replaces the need for faith and obedience, because practical service is the only measure of righteousness.", "Believers should avoid community projects unless every participant is already spiritually mature, because imperfect people cannot represent God’s Kingdom."], answer: 0 },
  { q: "A Rabbi of God’s word states that Philippians 2:9 cannot be read to suggest that Christ's elevation resulted from His submission to death since doing so would suggest that Jesus was not entirely divine prior to the crucifixion. According to a different Rabbi, this line of thinking conflates Christ's exaltation in the economy of redemption with His eternal divine identity. Which interpretation best settles this theological debate in light of Philippians 2:6–11's literary context?", options: ["Christ's obedience to death is significant to His humiliation but not to the Father's subsequent activity because His exaltation refers only to the restoration of His preincarnate glory.", "Christ's exaltation does not indicate that His deity started through the crucifixion; rather, it follows His submission to death as a consequential divine act, notably about His conferment of authority.", "Because the Father grants Christ a rank that was previously unattainable in return to His obedience, Christ's exaltation establishes His superiority over the Father in the divine order.", "The phrase \"wherefore\" conveys temporal succession without implying a consequential relationship because Christ's exaltation signifies the public affirmation of an unchanging divine position."], answer: 1 },
  { q: "A student makes the case during a theological conversation that Philippians 2:10–11 says that all people will eventually be saved because every tongue will proclaim Jesus Christ as Lord and every knee will bow. According to a different student, universal acceptance of Christ's sovereignty does not prove universal reconciliation on its own. Which explanation explains the difference between preserving allegiance and universal capitulation the best?", options: ["The universal confession explains how the entire created order will eventually acknowledge Christ's supreme authority.", "Since receiving eternal life is a prerequisite for truly acknowledging Christ's lordship, the universal confession inevitably involves regeneration.", "The universal confession only pertains to the redeemed, while those who remain outside the covenant community are barred from the universal submission outlined by Paul.", "The universal confession states that all human beings will have a second chance at salvation after death, when Christ's authority becomes fully visible to them according to (1Peter 3:18-19)."], answer: 0 },
  { q: "A brother who recently professed faith in Christ and began participating actively in the life of the church has engaged in sexual sin on three occasions since his conversion. Despite this, he continues attending Sunday services and Sunday School as though nothing has happened. As the resident pastor, you eventually learn about his conduct from one of the sisters with whom he had sexual relations. From a theological and pastoral perspective, what is the first thing he needs for spiritual restoration and growth?", options: ["Recommend sermons on the believer’s position in Christ and identity in Him.", "Teach him about the possibility of falling from grace and instil in him a fear of apostasy.", "Extend grace, speak calmly, and instruct him to keep the matter confidential.", "Teach and admonish him concerning Christ’s Lordship, distinguishing between being saved and living under government."], answer: 3 },
  { q: "Precious, a nurse, is told by her cell group leaders that unless she submits a written list of her income, possessions, and weekly schedule by Sunday, they will consider her unserious about Jesus. She hands over everything out of fear of being judged rather than out of conviction, and she privately resents it. Which assessment of her submission best fits the class teaching?", options: ["It meets the teaching because handing everything over proves that Jesus is truly Lord in her life, and willingness usually follows obedience.", "It meets the teaching because Jesus is Lord by divine appointment, so Ruth’s submission is required whether or not it is willing.", "It falls short because willing submission of every aspect of life is where true discipleship ends up, and Ruth is still at an earlier stage.", "It falls short because willing submission of every aspect of life is where true discipleship begins, and Ruth is acting under duress."], answer: 3 },
  { q: "A leading teacher in a local church begins to teach that because Christ’s kingdom is “not of this world,” His Lordship extends only to the immaterial soul. They say that physical callings and socio-economic stewardship and bodily ethics are irrelevant to one's surrender to Him. Which pillar of His Lordship from the manual deconstructs this dualism systematically?", options: ["Lordship by Revelation only, because of the emphasis on abstract language statements.", "Lordship by Creation and Resurrection; for these show His sovereign sovereignty over all.", "Lordship by Ecclesiastical Tradition. This stresses the customs of the church to the disadvantage of material reality.", "Lordship by Existential Experience, for it emphasizes inner actions rather than physical deeds."], answer: 1 },
  { q: "The Hypostatic Union must be used to comprehend Jesus' Lordship since He is both genuinely God and genuinely human. Which nature is appropriately the focus of this particular exaltation when Ephesians 1:20 says that God placed Him at His own right hand in the celestial places?", options: ["The divine nature, which had become ineffective throughout the incarnation.", "The human essence, which lost its true humanity when it was incorporated by the divine nature.", "The Incarnate Son, fully embodied in both natures.", "A new nature made especially for the ascension."], answer: 2 },
  { q: "Mr. Felix founded a Bible fellowship, pays its rent, and determines every programme. He tells the members that because the fellowship exists through him, its decisions are his to make, and questioning them is an act of rebellion. Some members feel uneasy, but they reason that a founder in his position must stand in Christ’s place for them. A visiting teacher says the arrangement has a fundamental flaw. Which statement best identifies the flaw?", options: ["He has not consulted the members first, since good leaders gather opinions before determining the direction of a ministry, even one they founded.", "There is no flaw, because the person who founds and funds a ministry holds rightful authority over it, and members who disagree remain free to leave.", "He treats the fellowship as his own, whereas Christ is its Head and its members are His body. Therefore, it answers to Christ’s Lordship, not to the founder’s ownership.", "He treats the fellowship as his own, whereas Christ is its Head and its members are His body. Therefore, it answers to Christ’s Lordship through the founder, who holds that headship on His behalf."], answer: 3 },
  { q: "A Sunday school member argues: \"Christians today show so little authority and power that the case for Jesus' Lordship has been weakened.\" According to the teaching on \"The Evidence of His Lordship\" Which assessment of his argument follows from how the teaching relates the basis of Christ's Lordship to its demonstration?", options: ["His right to rule rests on His divine identity, resurrection and exaltation, so little display among believers leaves that right intact but removes the only place where it is demonstrated.", "His right to rule rests on His divine identity, resurrection and exaltation, so little display among believers leaves that right intact and thins only one of the places where it is demonstrated.", "His right to rule is confirmed by what believers display, so little display among believers loosens that right and weakens the case for it in equal measure.", "His right to rule rests on His divine identity, resurrection and exaltation, so little display among believers is irrelevant to whether His Lordship is demonstrated at all."], answer: 1 },
  { q: "Kemi gave her life to Christ twelve years ago and still testifies of how He broke the hold of her old life. In recent years, however, her contact with the Lord has shrunk to Sunday services; she seldom prays or reads the Word on her own. When her neighbor’s child was tormented at night, Kemi prayed over the child with no result and told her cell group, \"Perhaps Jesus' Lordship does not reach such powers after all.\" Her cell leader, who attended the class on the evidence of His Lordship, must advise her. Which advice is most faithful to the teaching?", options: ["Advise her to seek a fresh manifestation of authority and power, since it is through manifested power that a believer is sustained in constant abiding with the Lord.", "Advise her to rest on her earlier testimony of freedom, since the power of salvation she experienced already settles whether His Lordship reaches such powers.", "Advise her to accept that authority over such powers belongs to those in ministry, since this proof of His Lordship is carried by office rather than by every believer.", "Advise her to return to constant abiding with the Lord, since it is through constant abiding that a believer's authority and power are manifested."], answer: 3 },
  { q: "Pastor Bola planted a church in a quiet farming village. In two years there has been no dramatic confrontation with demonic powers. Yet several converts have walked away from long-held destructive habits, and many members testify that they live each day in the Lord's presence, even in their work. At a leaders' retreat, Bola confesses, \"Without those confrontations, I wonder whether we are showing anyone that Jesus is Lord.\" A visiting member of DGC who attended the Sunday school class on the evidence of His Lordship replies.", options: ["\"Changed habits and a daily experience of His presence are encouraging but private; evidence of His Lordship becomes visible only when a church displays power over demonic forces.\"", "\"Changed habits and a daily experience of His presence are tangible proofs of His Lordship only as a preparation for authority over devils, so it will be demonstrated among you once such confrontations begin.\"", "\"Changed habits and a daily experience of His presence are tangible proofs of His Lordship in their own right, so it is already being demonstrated among you even without such confrontations.\"", "\"Changed habits are a tangible proof of His Lordship, but an experience of His presence is a feeling rather than evidence, so only the converts' changed lives demonstrate it among you.\""], answer: 2 },
  { q: "A believer preparing to share a testimony plan to says: \"Galatians 2:20 says Christ lives in me, so I will use it to illustrate the proof of Christ's abiding presence in the believer.\" According to the class on “The Evidence of His Lordship\" Do you think her plan is right?", options: ["Her plan matches the class: the verse supports the proof of Christ's abiding presence in the believer, alongside Matthew 28:20 and Psalm 91:1.", "Her plan departs from the class: the verse supports the proof of the power of salvation, alongside Romans 6:6 and Romans 10:9.", "Her plan departs from the class: the verse supports the proof of the transformation of the believer's life, alongside 2 Corinthians 3:18 and Romans 12:1-2.", "Her plan is partly right: the class used the verse for both the power of salvation and Christ's abiding presence in the believer."], answer: 1 },
  { q: "A believer says: \"I keep every command of Scripture, and I seek the Lord's leading on the big decisions of my life. The small, everyday choices I can handle with the wisdom He has given me.\" Which assessment of this position is consistent with the teaching on living under His Lordship?", options: ["It is sound, because Scripture governs a believer's actions and the Lord expects him to use the wisdom given to him, reserving His leading for weighty decisions.", "It is incomplete, because the reality of His Lordship is proven by obedience, so he should make the Word the final authority over his small choices as well as his large ones.", "It is incomplete, because those under His Lordship do nothing independent of Him, so small and large choices alike must be made in dependence on His leading.", "It is incomplete, because those under His Lordship do nothing independent of Him, so small and large choices alike may be made in dependence on His leading."], answer: 2 },
  { q: "Mr. Femi, a devoted church worker who fails to apply a command of Scripture: he tithes faithfully, avoids every practice the Word forbids, and even corrects doctrinal errors in the church with precision. Yet members find him harsh and impatient, and when a fellow worker complained, he replied, \"My duty is to obey the Word and correct what is wrong; how people feel about it is not my concern.\" The church's discipleship coordinator, who took the class on living under the Lordship of Jesus, is asked to assess his life against the teaching. Which assessment is most faithful?", options: ["His obedience to the Word is genuine, but living under Christ's Lordship also entails reflecting His character, so the harshness exposes an entailment that obedience alone does not supply.", "His obedience to the Word is genuine, but reflecting Christ's character is simply the outcome of obedience, so the harshness exposes an entailment that fuller obedience would supply.", "His obedience to the Word is the proof of Christ's Lordship in his life, so his manner toward people is a matter of temperament rather than of living under His Lordship, and nothing is lacking.", "His obedience to the Word is genuine, but the harshness shows that his will and desires are not yet yielded to Christ's control, since a submitted believer would correct others differently."], answer: 0 },
  { q: "A unit leader tells his unit: \"Obedience is how you make Jesus the Lord of your life.\" Which statement gives the relationship between obedience and His Lordship that the class taught?", options: ["Jesus becomes Lord in a person's life when he acknowledges Him, and obedience is a later and optional expression of that Lordship.", "Obedience is the means by which Jesus becomes Lord in a person's life, and it is also the proof that He is truly Lord there.", "Acknowledging His authority is the proof that Jesus is truly Lord in a person's life, and obedience is only the outcome of that acknowledgement.", "Obedience is the proof that Jesus is truly Lord in a person's life, and it is not the means by which He becomes Lord there."], answer: 3 },
  { q: "A believer announces that the Spirit has led him to withhold a payment he owes, an act Scripture plainly forbids. He insists that dependence on the Lord's leading outranks obedience to the written Word. Which assessment follows from how the class related these two parts of living under His Lordship?", options: ["The Spirit's leading is the final authority over his actions, so a leading that contradicts the Word overrides it, though obedience to the Word still applies elsewhere.", "Neither has the last word, since the Word governs actions and the Spirit directs steps, so the clash is only apparent and he may follow either without failing His Lordship.", "The Word is the final authority over his actions, so a leading that contradicts it cannot override it, though dependence on His leading still applies elsewhere.", "Obedience proves the reality of His Lordship, so he need not depend on any leading at all, since only the Word is required of those who live under Him."], answer: 2 },
  { q: "A Christian attends every church prayer meeting but rarely prays privately. He believes corporate prayer is sufficient. What lesson can he learn from Jesus’ example?", options: ["Private prayer is unnecessary when corporate prayer is available.", "Private prayer strengthens our personal relationship with God.", "Prayer is only necessary during church services.", "Private prayer is only for church leaders."], answer: 1 },
  { q: "A believer frequently checks his phone while praying and quickly ends his prayers whenever he feels tired. Which characteristic of Jesus’ prayer life does he need to develop?", options: ["Intercession", "Confidence", "Fervency", "Solitude"], answer: 2 },
  { q: "A Christian refuses to pray for others because she believes her prayers cannot make a difference. She also focuses only on her personal needs. What two characteristics should she learn from Jesus?", options: ["Solitude and extended time", "Confidence and intercession", "Fervency and solitude", "Extended time and confidence"], answer: 1 },
  { q: "A church leader spends only five minutes praying daily and makes important decisions without taking time to seek God. What lesson can he learn from Jesus’ example in Luke 6:12–13?", options: ["Prayer is only necessary before major events.", "Long periods of prayer are reserved for pastors.", "Consistently spending extended time in prayer is valuable.", "Five minutes of prayer is always sufficient."], answer: 2 },
  { q: "A believer claims to desire a deeper relationship with God but rarely feels the urge to pray or seek Him. According to the lesson, what is missing in his spiritual life?", options: ["Knowledge of the Bible", "Hunger for God", "Church attendance", "Fellowship with other believers"], answer: 1 },
  { q: "A Christian prays every day but does so carelessly, often thinking about other things. Which quality does she need to develop to deepen her intimacy with God?", options: ["Intentionality and sincerity", "Public speaking", "Biblical knowledge alone", "Church participation"], answer: 0 },
  { q: "A believer spends time studying the Bible but rarely prays because he believes studying God's Word alone is enough to develop intimacy with Him. What is the best response?", options: ["Studying the Word is the only requirement for intimacy with God.", "Prayer is only necessary when facing challenges.", "Prayer provides an avenue for fellowship and deeper intimacy with God.", "Intimacy with God depends entirely on church attendance."], answer: 2 },
  { q: "A young Christian wants to know God more deeply but treats prayer as a religious duty rather than an opportunity to fellowship with Him. What should he understand?", options: ["Prayer is mainly for presenting personal requests.", "Prayer is a platform for cultivating a deep relationship with God.", "Prayer is only effective when done in public.", "Fellowship with God is possible without intentional communion."], answer: 1 },
  { q: "A believer desires to make a spiritual impact in his community but rarely spends time praying. According to the lesson, what should he understand?", options: ["Spiritual impact depends mainly on public speaking.", "Prayer is essential for manifesting the life and power of God.", "The supernatural is only for church leaders.", "Good intentions alone are enough."], answer: 1 },
  { q: "After a time of prayer, a Christian becomes more aware of God's power and begins to expect Him to work beyond natural limitations. Which relationship between prayer and the supernatural does this illustrate?", options: ["Prayer builds consciousness of the supernatural.", "Prayer removes the need for faith.", "Prayer is only useful during church services.", "Prayer guarantees that believers will never face challenges."], answer: 0 },
  { q: "A young believer faces temptation and feels pressured to do what is wrong. Remembering Jesus' teaching in Matthew 26:41, what should the believer do?", options: ["Depend only on personal strength.", "Avoid prayer until the temptation passes.", "Watch and pray so as not to fall into temptation.", "Assume temptation means God has abandoned him."], answer: 2 },
  { q: "A Christian wants to see God's power demonstrated but treats prayer as unnecessary. Based on the lesson, what is the best response?", options: ["The supernatural is unrelated to a believer's prayer life.", "Prayer activates the supernatural and strengthens faith and conviction.", "Only miracles recorded in the Bible can happen.", "Prayer is needed only after a miracle has occurred."], answer: 1 },
  { q: "A student says wisdom is only a collection of good ideas and has nothing to do with Jesus. Based on John 1:1–3 and the lesson, what is the best response?", options: ["Wisdom is found only in human experience.", "Jesus is the eternal Word through whom all things were made and reveals God’s wisdom.", "Jesus became wise only after He began His ministry.", "God’s wisdom is unrelated to creation."], answer: 1 },
  { q: "A young Christian wants to think and live in a way that reflects God’s wisdom. Which example from Jesus should guide the believer?", options: ["Seeking popularity above all else.", "Depending only on human opinions.", "Following Jesus’ example of humility, love, and obedience to God.", "Avoiding every responsibility that requires sacrifice."], answer: 2 },
