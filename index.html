<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunday School Test | Davidic Generation Church</title>
<style>
  :root { --bg:#f6f3f8; --card:#fff; --ink:#241a2e; --accent:#783a97; --accent-dk:#2b1245; --gold:#d3ae39; --gold-dk:#ae8a2e; --muted:#6f6479; --line:#e4dcea; --tint:#f3ebf8; --ok:#1a8f4c; --bad:#c93c3c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  h1, .score { font-family:Montserrat,Inter,system-ui,sans-serif; }
  .brandbar { background:var(--accent-dk); border-bottom:4px solid var(--gold); }
  .brandbar .in { max-width:720px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; }
  .brandbar img { height:56px; width:auto; display:block; }
  .wrap { max-width:720px; margin:0 auto; padding:20px 16px 20px; }
  .card { background:var(--card); border-radius:12px; padding:22px; margin-bottom:16px; box-shadow:0 1px 4px rgba(40,10,60,.1); border-top:3px solid var(--gold); }
  h1 { margin:0 0 6px; font-size:1.5rem; color:var(--accent); }
  p.sub { margin:0 0 16px; color:var(--muted); }
  label.f { display:block; font-weight:600; margin:12px 0 4px; }
  input[type=text], input[type=email] { width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; font:1rem Inter,system-ui,sans-serif; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:12px 22px; font:600 1rem Inter,system-ui,sans-serif; cursor:pointer; margin-top:16px; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); margin-right:8px; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .q { font-weight:600; margin-bottom:10px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:9px 10px; border:1px solid var(--line); border-radius:8px; margin:6px 0; cursor:pointer; font-weight:400; }
  .opt:hover { background:var(--tint); }
  #timer { position:sticky; top:0; background:var(--accent); color:#fff; padding:8px 14px; border-radius:0 0 10px 10px; text-align:right; font-weight:600; z-index:5; }
  .hidden { display:none; }
  .msg { padding:10px 12px; border-radius:8px; margin-top:12px; }
  .msg.bad { background:#fdeaea; color:var(--bad); }
  .msg.info { background:var(--tint); color:#4a2266; }
  .score { font-size:2rem; font-weight:700; color:var(--gold-dk); }
  .rev { border-left:5px solid #ccc; }
  .rev.right { border-left-color:var(--ok); }
  .rev.wrong { border-left-color:var(--bad); }
  .tag { font-weight:700; }
  .tag.right { color:var(--ok); } .tag.wrong { color:var(--bad); }
  .line { margin:4px 0; }
  .foot { text-align:center; padding:6px 16px 32px; color:var(--muted); font-size:.85rem; }
  .foot b { color:var(--accent); font-family:Montserrat,Inter,sans-serif; }
</style>
</head>
