/* ============================================================
   3. EXAM LOGIC & HIGH-CONCURRENCY SAFEGUARDS
   ============================================================ */
const $ = id => document.getElementById(id);
let paper = [], student = {}, timerId = null, endTime = 0, submitted = false;
let tabSwitches = 0;
const T = s => s ? new Date(s).getTime() : null;
const START = T(CONFIG.startAt), END = T(CONFIG.endAt), REVEAL = T(CONFIG.revealAt) || END;
const notOpen   = () => START !== null && Date.now() < START;
const isClosed  = () => END !== null && Date.now() >= END;
const isRevealed = () => REVEAL === null || Date.now() >= REVEAL;
const fmt = ms => new Date(ms).toLocaleString("en-US", { dateStyle: "full", timeStyle: "short" });
const KEY = e => "exam_attempt_" + e;

// Anti-cheat: track window unfocus / tab switches
window.addEventListener("blur", () => {
  if (paper.length > 0 && !submitted) {
    tabSwitches++;
  }
});

function show(ids) {
  ["start","lookup","exam","submitBox","timer","result"].forEach(x => $(x).classList.add("hidden"));
  ids.split(",").forEach(x => $(x).classList.remove("hidden"));
  $("saveStatus").classList.add("hidden");
  window.scrollTo(0, 0);
}
function showErr(el, text) { el.textContent = text; el.classList.remove("hidden"); }

function refreshStart() {
  $("examTitle").textContent = CONFIG.title;
  $("examIntro").textContent = CONFIG.intro;
  document.title = CONFIG.title;

  const wait = notOpen();
  const closed = isClosed();

  // RULE: Once the exam closes, the exam interface disappears completely!
  // The page immediately defaults to Result Checking & Review mode.
  if (closed) {
    show("lookup");
    $("lookupTitle").textContent = "Exam Closed - Check Results & Review";
    $("lookupSub").textContent = "The exam has officially ended. Enter your registered email address below to view your score, check what you got right or wrong, and review the correct answers.";
    $("lookupBack").classList.add("hidden");
    return;
  }

  // If exam has not opened yet
  if (wait) {
    show("start");
    $("registerBox").classList.add("hidden");
    $("waitMsg").classList.remove("hidden");
    $("waitMsg").textContent = "The exam has not opened yet. It opens on " + fmt(START) + ".";
    return;
  }

  // Exam is OPEN
  show("start");
  $("registerBox").classList.remove("hidden");
  $("waitMsg").classList.add("hidden");
  $("closedMsg").classList.add("hidden");
  $("revealInfo").textContent = "Correct answers and question review will be unlocked after the exam closes on " + fmt(END) + ". You will see your score immediately after you submit.";
}
function home() { show("start"); refreshStart(); }
home();
setInterval(() => { if (!$("start").classList.contains("hidden")) refreshStart(); }, 15000);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function buildPaper() {
  let qs = shuffle(QUESTIONS);
  if (CONFIG.questionsPerStudent > 0) qs = qs.slice(0, CONFIG.questionsPerStudent);
  return qs.map(item => ({ q: item.q, opts: shuffle(item.options.map((text, i) => ({ text, correct: i === item.answer }))) }));
}
function render() {
  const form = $("exam"); form.innerHTML = "";
  paper.forEach((item, qi) => {
    const card = document.createElement("div"); card.className = "card";
    const title = document.createElement("div"); title.className = "q"; title.textContent = (qi + 1) + ". " + item.q;
    card.appendChild(title);
    item.opts.forEach((o, oi) => {
      const lab = document.createElement("label"); lab.className = "opt";
      const r = document.createElement("input"); r.type = "radio"; r.name = "q" + qi; r.value = oi;
      const span = document.createElement("span"); span.textContent = o.text;
      lab.appendChild(r); lab.appendChild(span); card.appendChild(lab);
    });
    form.appendChild(card);
  });
}

$("startBtn").addEventListener("click", () => {
  if (notOpen() || isClosed()) return refreshStart();
  const name = $("fullName").value.trim();
  const email = $("email").value.trim().toLowerCase();
  const err = $("startErr"); err.classList.add("hidden");
  if (name.split(/\s+/).length < 2) return showErr(err, "Please enter your full name (first and last name).");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr(err, "Please enter a valid email address.");
  try { if (localStorage.getItem(KEY(email))) return showErr(err, "This email has already submitted the exam."); } catch (e) {}
  student = { name, email };
  paper = buildPaper(); render();
  show("exam,submitBox,timer");
  endTime = Date.now() + CONFIG.timeLimitMinutes * 60000;
  if (END !== null) endTime = Math.min(endTime, END);
  saveProgress();
  tick(); timerId = setInterval(tick, 1000);
});

function tick() {
  const left = Math.max(0, endTime - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
  $("timer").textContent = "Time left: " + m + ":" + String(s).padStart(2, "0");
  if (left <= 0) { clearInterval(timerId); finish(true); }
}

$("submitBtn").addEventListener("click", () => {
  const un = paper.filter((_, i) => !document.querySelector('input[name="q' + i + '"]:checked')).length;
  if (un > 0 && !confirm(un + " question(s) unanswered. Submit anyway?")) return;
  $("submitBtn").disabled = true;
  $("submitBtn").textContent = "Submitting exam...";
  finish(false);
});

function finish(auto) {
  if (submitted) return;
  submitted = true; clearInterval(timerId);
  let score = 0;
  const items = paper.map((item, i) => {
    const picked = document.querySelector('input[name="q' + i + '"]:checked');
    const chosen = picked ? item.opts[+picked.value] : null;
    const right = item.opts.find(o => o.correct);
    const ok = !!(chosen && chosen.correct);
    if (ok) score++;
    return { q: item.q, chosen: chosen ? chosen.text : null, right: right.text, ok };
  });
  const attempt = { name: student.name, email: student.email, score, total: paper.length, items, auto, tabSwitches, at: Date.now() };
  try { localStorage.setItem(KEY(student.email), JSON.stringify(attempt)); localStorage.removeItem(PROGRESS_KEY); } catch (e) {}
  showAttempt(attempt);
  saveResult(attempt);
}

/* ---- keep progress safe if the browser crashes or the page is refreshed ---- */
const PROGRESS_KEY = "exam_progress";
const EXAM_ID = CONFIG.title + "|" + QUESTIONS.length;
function saveProgress() {
  try {
    const answers = {};
    paper.forEach((_, i) => {
      const p = document.querySelector('input[name="q' + i + '"]:checked');
      if (p) answers[i] = +p.value;
    });
    localStorage.setItem(PROGRESS_KEY, JSON.stringify({ v: EXAM_ID, student, paper, answers, endTime, tabSwitches }));
  } catch (e) {}
}
$("exam").addEventListener("change", saveProgress);

/* ---- Firebase (Firestore) saving with High-Concurrency Stagger & Jitter ---- */
const FB = CONFIG.firebase || {};
const fbOn = () => !!(FB.projectId && FB.apiKey);
function docId(email) { return "e_" + email.toLowerCase().replace(/[^a-z0-9._@+-]/g, "_"); }
function setSave(text, bad) {
  const el = $("saveStatus");
  el.textContent = text;
  el.className = "msg " + (bad ? "bad" : "info");
}
function toFields(p) {
  return { fields: {
    exam: { stringValue: p.exam }, name: { stringValue: p.name }, email: { stringValue: p.email },
    score: { integerValue: String(p.score) }, total: { integerValue: String(p.total) }, percent: { integerValue: String(p.percent) },
    result: { stringValue: p.result }, auto: { stringValue: p.auto }, submittedAt: { timestampValue: p.submittedAt },
    details: { stringValue: p.details }
  } };
}

async function postResult(p, key, n, visible) {
  const url = "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(FB.projectId) +
    "/databases/(default)/documents/" + encodeURIComponent(FB.collection || "results") +
    "?documentId=" + encodeURIComponent(docId(p.email)) + "&key=" + encodeURIComponent(FB.apiKey);
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(toFields(p)) });
    if (res.ok) {
      try { localStorage.removeItem(key); } catch (e) {}
      if (visible) setSave("Your result has been safely recorded.");
      return;
    }
    if (res.status === 409) {   // Result already recorded earlier (idempotent success)
      try { localStorage.removeItem(key); } catch (e) {}
      if (visible) setSave("Your result has been safely recorded.");
      return;
    }
    if (res.status === 400 || res.status === 403) {
      if (visible) setSave("Your score is shown above, but saving failed. Please take a screenshot for your organizer.", true);
      return;
    }
    throw new Error("HTTP " + res.status);
  } catch (e) {
    if (n < 6) {
      if (visible) setSave("Saving your result... (retrying in a moment)");
      // Exponential backoff with random jitter to prevent thundering herd
      const retryDelay = (1500 * Math.pow(1.5, n)) + Math.floor(Math.random() * 2000);
      setTimeout(() => postResult(p, key, n + 1, visible), retryDelay);
    } else if (visible) {
      setSave("Could not reach the server yet. Your result is stored safely on this device and will send automatically once connected.", true);
    }
  }
}

function saveResult(a) {
  if (!fbOn()) return;
  const percent = Math.round((a.score / a.total) * 100);
  
  // Save items as structured JSON so any device can reconstruct the review
  const details = JSON.stringify({
    items: a.items.map(it => ({ q: it.q, chosen: it.chosen, right: it.right, ok: it.ok })),
    tabSwitches: a.tabSwitches || 0
  });
  
  const payload = { exam: CONFIG.title, name: a.name, email: a.email, score: a.score, total: a.total, percent,
    result: "Submitted", auto: a.auto ? "Yes" : "No", submittedAt: new Date(a.at).toISOString(), details };
  const key = "exam_pending_" + a.email;
  try { localStorage.setItem(key, JSON.stringify(payload)); } catch (e) {}
  setSave("Saving your result...");
  
  // High-concurrency safeguard: if 1,700 students auto-submit at the same second,
  // spread the request burst gently over a 0 to 5 second randomized jitter window.
  const jitterMs = a.auto ? Math.floor(Math.random() * 5000) : 0;
  setTimeout(() => postResult(payload, key, 0, true), jitterMs);
}

// Re-send any result that did not reach the database (e.g. connection dropped)
(function retryPending() {
  if (!fbOn()) return;
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf("exam_pending_") === 0) keys.push(k);
    }
    keys.forEach(k => postResult(JSON.parse(localStorage.getItem(k)), k, 0, false));
  } catch (e) {}
})();

// Resume an exam in progress after a crash or refresh
(function resume() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "null"); } catch (e) {}
  if (!p || p.v !== EXAM_ID || !p.paper || !p.student) return;
  try { if (localStorage.getItem(KEY(p.student.email))) { localStorage.removeItem(PROGRESS_KEY); return; } } catch (e) {}
  student = p.student; paper = p.paper; endTime = p.endTime; tabSwitches = p.tabSwitches || 0;
  render();
  Object.keys(p.answers || {}).forEach(i => {
    const r = document.querySelector('input[name="q' + i + '"][value="' + p.answers[i] + '"]');
    if (r) r.checked = true;
  });
  show("exam,submitBox,timer");
  tick();
  if (!submitted) timerId = setInterval(tick, 1000);
})();

function showAttempt(a) {
  const percent = Math.round((a.score / a.total) * 100);
  const review = $("review"); review.innerHTML = "";
  show("result");
  $("resultName").textContent = a.name;
  $("scoreText").textContent = a.score + " / " + a.total + " (" + percent + "%)";
  const prefix = a.auto ? "Time ran out, so your exam was submitted automatically. " : "";

  // WHILE EXAM IS ACTIVE: Show score immediately, but withhold answers
  if (!isRevealed()) {
    $("resultNote").textContent = prefix + "Your exam has been submitted safely and your score is recorded! Detailed question review and correct answers will unlock once the exam officially ends on " + fmt(REVEAL) + ". Please return to this page after that time to view what you got right and wrong.";
    return;
  }

  // ONCE EXAM CLOSES: Reveal complete question breakdown & correct answers
  $("resultNote").textContent = prefix + "Detailed question review and correct answers are shown below:";
  if (Array.isArray(a.items)) {
    a.items.forEach((it, i) => {
      const card = document.createElement("div"); card.className = "card rev " + (it.ok ? "right" : "wrong");
      const q = document.createElement("div"); q.className = "q"; q.textContent = (i + 1) + ". " + it.q;
      const tag = document.createElement("div"); tag.className = "line";
      const t = document.createElement("span"); t.className = "tag " + (it.ok ? "right" : "wrong");
      t.textContent = it.ok ? "✓ Correct" : (it.chosen ? "✗ Wrong" : "Not answered"); tag.appendChild(t);
      const y = document.createElement("div"); y.className = "line"; y.textContent = "Your answer: " + (it.chosen || "(no answer)");
      card.appendChild(q); card.appendChild(tag); card.appendChild(y);
      if (!it.ok) {
        const c = document.createElement("div"); c.className = "line"; c.style.fontWeight = "600";
        c.textContent = "Correct answer: " + it.right;
        card.appendChild(c);
      }
      review.appendChild(card);
    });
  }
}

$("lookupBtn").addEventListener("click", () => { show("lookup"); $("lookupErr").classList.add("hidden"); });
$("lookupBack").addEventListener("click", home);
$("resultBack").addEventListener("click", home);

$("lookupGo").addEventListener("click", async () => {
  const email = $("lookupEmail").value.trim().toLowerCase();
  const err = $("lookupErr"); err.classList.add("hidden");
  if (!email) return showErr(err, "Please enter your email address.");

  // 1. Check local storage first
  let raw = null;
  try { raw = localStorage.getItem(KEY(email)); } catch (e) {}
  if (raw) {
    showAttempt(JSON.parse(raw));
    return;
  }

  // 2. Query Firestore live (allows students to check from ANY phone, computer, or browser!)
  if (fbOn()) {
    $("lookupGo").disabled = true;
    $("lookupGo").textContent = "Checking records...";
    try {
      const url = "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(FB.projectId) +
        "/databases/(default)/documents/" + encodeURIComponent(FB.collection || "results") +
        "/" + encodeURIComponent(docId(email)) + "?key=" + encodeURIComponent(FB.apiKey);
      const res = await fetch(url);
      if (res.ok) {
        const doc = await res.json();
        const f = doc.fields || {};
        const score = parseInt(f.score?.integerValue || 0);
        const total = parseInt(f.total?.integerValue || (CONFIG.questionsPerStudent || QUESTIONS.length));
        const name = f.name?.stringValue || "Candidate";
        const auto = f.auto?.stringValue === "Yes";
        const at = f.submittedAt?.timestampValue ? new Date(f.submittedAt.timestampValue).getTime() : Date.now();
        
        let items = [];
        try {
          const parsed = JSON.parse(f.details?.stringValue || "{}");
          if (Array.isArray(parsed.items)) items = parsed.items;
        } catch(e) {}

        const attempt = { name, email, score, total, items, auto, at };
        showAttempt(attempt);
        return;
      } else if (res.status === 404) {
        showErr(err, "No submission found for this email. Please check your spelling.");
        return;
      }
    } catch(e) {
      showErr(err, "Network error checking result. Please try again.");
      return;
    } finally {
      $("lookupGo").disabled = false;
      $("lookupGo").textContent = "View My Result & Answers";
    }
  }

  showErr(err, "No saved result found for this email address.");
});
</script>
